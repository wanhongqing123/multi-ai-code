name: Assemble verified release asset

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag
        required: true
        type: string
      asset_name:
        description: Final asset filename
        required: true
        type: string
      part_count:
        description: Number of numbered parts
        required: true
        type: string
      asset_size:
        description: Expected total bytes
        required: true
        type: string
      asset_sha256:
        description: SHA256 of the locally verified file
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: assemble-release-${{ inputs.release_tag }}-${{ inputs.asset_name }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify parts and upload the complete file
        run: python3 scripts/assemble-release-asset.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          PART_COUNT: ${{ inputs.part_count }}
          ASSET_SIZE: ${{ inputs.asset_size }}
          ASSET_SHA256: ${{ inputs.asset_sha256 }}
