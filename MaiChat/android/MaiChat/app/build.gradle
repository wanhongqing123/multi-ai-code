plugins {
    id "com.android.application"
}

// 腾讯云 ASR 凭证从 local.properties 读，绝不进源码。local.properties 已被
// 两层 .gitignore 忽略，所以提交出去的代码里不含任何密钥；没配时三项为空字符串，
// 语音识别自动降级为「照旧发语音消息」，构建不会失败。
def asrProps = new Properties()
def asrPropsFile = rootProject.file("local.properties")
if (asrPropsFile.exists()) {
    asrPropsFile.withInputStream { asrProps.load(it) }
}
def asrValue = { String key -> (asrProps.getProperty(key) ?: "").trim() }

android {
    namespace "com.kongshang.maichat"
    compileSdk 34
    ndkVersion "27.3.13750724"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
            buildStagingDirectory ".cxx/mobile-agent-adapter"
        }
    }

    defaultConfig {
        applicationId "com.kongshang.maichat"
        minSdk 26
        targetSdk 34
        versionCode 78
        versionName "0.1.78"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TENCENT_ASR_APP_ID", "\"${asrValue('tencent.asr.appId')}\""
        buildConfigField "String", "TENCENT_ASR_SECRET_ID", "\"${asrValue('tencent.asr.secretId')}\""
        buildConfigField "String", "TENCENT_ASR_SECRET_KEY", "\"${asrValue('tencent.asr.secretKey')}\""

        externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON" } }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def graphicsEffectsOutput = file("$buildDir/generated/maiagent-graphics-assets")
tasks.register("stageMaiAgentGraphicsEffects", Sync) {
    from(file("$projectDir/../../../../MaiAgent/Graphics/data")) {
        include "*.effect"
        into "MaiAgentGraphics"
    }
    from(file("$projectDir/../../../../MaiChat/Media/data")) {
        include "*.effect"
        into "MaiAgentGraphics"
    }
    into graphicsEffectsOutput
}
android.sourceSets.main.assets.srcDir(graphicsEffectsOutput)
// Each feature is a Java source root; package names stay stable across feature directories.
android.sourceSets.main.java.setSrcDirs([
    "src/main/java/app",
    "src/main/java/assistant",
    "src/main/java/chat",
    "src/main/java/contacts",
    "src/main/java/im",
    "src/main/java/MaiChatTools",
    "src/main/java/media",
    "src/main/java/remote",
    "src/main/java/ui",
])
android.sourceSets.androidTest.assets.srcDir(
    file("$projectDir/../../../../MaiAgent/Graphics/tests/fixtures"))
tasks.configureEach {
    if (name.startsWith("merge") && name.endsWith("Assets")) {
        dependsOn("stageMaiAgentGraphicsEffects")
    }
}

dependencies {
    implementation "androidx.core:core:1.10.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.mlkit:face-detection:16.1.7"
    implementation "com.google.mlkit:segmentation-selfie:16.0.0-beta6"
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tasklist:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"

    // 腾讯云一句话识别。settings.gradle 是 FAIL_ON_PROJECT_REPOS，模块里不能加
    // flatDir 仓库，所以用 files() 直接引 vendored 的 aar。
    implementation files("libs/asr-one-sentence-release.aar")
    implementation "com.google.code.gson:gson:2.8.5"
    implementation "com.tencent.imsdk:imsdk-plus:9.0.7665"
    implementation "com.tencent.liteav:LiteAVSDK_TRTC:13.4.0.20477"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "org.robolectric:robolectric:4.12.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.2"
}
