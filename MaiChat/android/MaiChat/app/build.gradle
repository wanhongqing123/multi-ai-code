plugins {
    id "com.android.application"
}

// 腾讯云 ASR 凭证从 local.properties 读，绝不进源码。local.properties 已被
// 两层 .gitignore 忽略，所以提交出去的代码里不含任何密钥；没配时三项为空字符串，
// 语音识别自动降级为「照旧发语音消息」，构建不会失败。
def asrProps = new Properties()
def asrPropsFile = rootProject.file("local.properties")
if (asrPropsFile.exists()) {
    asrPropsFile.withInputStream { asrProps.load(it) }
}
def asrValue = { String key -> (asrProps.getProperty(key) ?: "").trim() }

android {
    namespace "com.kongshang.maichat"
    compileSdk 34

    defaultConfig {
        applicationId "com.kongshang.maichat"
        minSdk 26
        targetSdk 34
        versionCode 66
        versionName "0.1.66"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TENCENT_ASR_APP_ID", "\"${asrValue('tencent.asr.appId')}\""
        buildConfigField "String", "TENCENT_ASR_SECRET_ID", "\"${asrValue('tencent.asr.secretId')}\""
        buildConfigField "String", "TENCENT_ASR_SECRET_KEY", "\"${asrValue('tencent.asr.secretKey')}\""

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.10.1"
    // 腾讯云一句话识别。settings.gradle 是 FAIL_ON_PROJECT_REPOS，模块里不能加
    // flatDir 仓库，所以用 files() 直接引 vendored 的 aar。
    implementation files("libs/asr-one-sentence-release.aar")
    implementation "com.google.code.gson:gson:2.8.5"
    implementation "com.tencent.imsdk:imsdk-plus:9.0.7665"
    implementation "com.tencent.liteav:LiteAVSDK_TRTC:13.4.0.20477"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "org.robolectric:robolectric:4.12.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.2"
}
