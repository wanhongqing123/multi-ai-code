// 文件作用：配置 Android App 模块的插件、依赖、变体和原生构建选项。
// 阅读边界：此文件负责构建或测试流程，不在应用运行时解释为业务逻辑。
plugins {
    id "com.android.application"
}

// 实时 ASR 地址由账号服务按登录态签发；所有 APK 均不嵌入腾讯长期密钥。
def releaseStorePath = System.getenv("MAICHAT_ANDROID_KEYSTORE")
def releaseStorePassword = System.getenv("MAICHAT_ANDROID_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("MAICHAT_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("MAICHAT_ANDROID_KEY_PASSWORD")

// RVM 原生推理库统一由仓库内 ONNX Runtime 源码构建，不从 Maven 下载预编译包。
// 首次运行 MaiAgent/scripts/build-onnxruntime-android-jni.sh 生成这两个 ABI 的库。
def localOrtJniLibs = file("$projectDir/../../../../MaiAgent/build/vendor/onnxruntime-android-jni")

android {
    namespace "com.kongshang.maichat"
    compileSdk 34
    ndkVersion "27.3.13750724"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
            buildStagingDirectory ".cxx/mobile-agent-adapter"
        }
    }

    defaultConfig {
        applicationId "com.kongshang.maichat"
        minSdk 26
        targetSdk 34
        versionCode 237
        versionName "2.2.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON" } }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    // 本机假账号服务必须由调试构建显式启用；发布包不包含该开关。
    buildTypes {
        debug {
            if (project.findProperty("maichatIsolatedDebug") == "true")
                applicationIdSuffix ".isolated"
            buildConfigField "boolean", "USE_LOCAL_UI_AUTH",
                (project.findProperty("maichatLocalUiAuth") == "true").toString()
        }
        release {
            buildConfigField "boolean", "USE_LOCAL_UI_AUTH", "false"
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword)
                signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def graphicsEffectsOutput = file("$buildDir/generated/maiagent-graphics-assets")
tasks.register("stageMaiAgentGraphicsEffects", Sync) {
    from(file("$projectDir/../../../../MaiAgent/Graphics/data")) {
        include "*.effect"
        into "MaiAgentGraphics"
    }
    from(file("$projectDir/../../../../MaiChat/Media/data")) {
        include "*.effect"
        into "MaiAgentGraphics"
    }
    from(file("$projectDir/../../../../MaiAgent/models")) {
        include "rvm_mobilenetv3_fp32.onnx", "RVM_LICENSE"
        into "MaiAgentModels"
    }
    // PDF 核心静态链接 qpdf；许可与归属随 App 发布，不能只留在开发机源目录。
    from(file("$projectDir/../../../../MaiAgent/third_party/qpdf")) {
        include "LICENSE.txt", "NOTICE.md"
        into "MaiPdfLicenses"
    }
    into graphicsEffectsOutput
}
android.sourceSets.main.assets.srcDir(graphicsEffectsOutput)
android.sourceSets.main.jniLibs.srcDir(localOrtJniLibs)
// Each feature is a Java source root; package names stay stable across feature directories.
android.sourceSets.main.java.setSrcDirs([
    "src/main/java/app",
    "src/main/java/assistant",
    "src/main/java/chat",
    "src/main/java/contacts",
    "src/main/java/im",
    "src/main/java/MaiChatTools",
    "src/main/java/media",
    "src/main/java/remote",
    "src/main/java/ui",
])
android.sourceSets.androidTest.assets.srcDir(
    file("$projectDir/../../../../MaiAgent/Graphics/tests/fixtures"))
def attachmentTlsTestAssets = file("$buildDir/generated/attachment-tls-test-assets")
tasks.register("stageAttachmentTlsTestAssets") {
    outputs.dir(attachmentTlsTestAssets)
    outputs.upToDateWhen { false }
    doLast {
        attachmentTlsTestAssets.mkdirs()
        def key = file("$attachmentTlsTestAssets/local_tls_server.key")
        def certificate = file("$attachmentTlsTestAssets/local_tls_ca.pem")
        def keystore = file("$attachmentTlsTestAssets/local_tls_server.p12")
        exec {
            commandLine "openssl", "req", "-x509", "-newkey", "rsa:2048", "-nodes",
                "-keyout", key.absolutePath, "-out", certificate.absolutePath,
                "-days", "1", "-subj", "/CN=localhost",
                "-addext", "subjectAltName=DNS:localhost"
        }
        exec {
            commandLine "openssl", "pkcs12", "-export", "-inkey", key.absolutePath,
                "-in", certificate.absolutePath, "-out", keystore.absolutePath,
                "-passout", "pass:maichat-test"
        }
        key.delete()
    }
}
android.sourceSets.androidTest.assets.srcDir(attachmentTlsTestAssets)
tasks.configureEach {
    if (name.startsWith("merge") && name.endsWith("Assets")) {
        dependsOn("stageMaiAgentGraphicsEffects")
    }
    if (name.startsWith("merge") && name.endsWith("AndroidTestAssets")) {
        dependsOn("stageAttachmentTlsTestAssets")
    }
}

tasks.register("checkLocalOnnxRuntime") {
    doLast {
        for (def abi : ["armeabi-v7a", "arm64-v8a"]) {
            def runtime = new File(localOrtJniLibs, "$abi/libonnxruntime.so")
            if (!runtime.isFile()) {
                throw new GradleException("Build local ONNX Runtime first: MaiAgent/scripts/build-onnxruntime-android-jni.sh")
            }
        }
    }
}
tasks.named("preBuild") { dependsOn("checkLocalOnnxRuntime") }

dependencies {
    implementation "androidx.core:core:1.10.1"
    // 相机/ML Kit 的传递依赖版本不同；统一 Kotlin 标准库版本，避免打包重复类。
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "com.google.mlkit:face-detection:16.1.7"
    implementation "com.google.mlkit:segmentation-selfie:16.0.0-beta6"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "com.google.zxing:core:3.5.3"
    implementation "androidx.activity:activity:1.8.2"
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tasklist:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"

    implementation "com.google.code.gson:gson:2.8.5"
    implementation "com.tencent.imsdk:imsdk-plus:9.0.7665"
    implementation "com.tencent.liteav:LiteAVSDK_TRTC:13.4.0.20477"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "org.robolectric:robolectric:4.12.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.2"
}
