// 文件作用：声明 Android 工程模块与依赖仓库入口。
// 阅读边界：此文件负责构建或测试流程，不在应用运行时解释为业务逻辑。
pluginManagement {
    // CameraX 1.4.2 needs a newer D8 than the one embedded in AGP 7.4.2.
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath "com.android.tools:r8:8.6.17"
        }
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MaiChatAndroid"
include ":app"
