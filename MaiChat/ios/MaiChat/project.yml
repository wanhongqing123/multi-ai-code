name: MaiChat
options:
  bundleIdPrefix: com.kongshang.maichat
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.81"
    CURRENT_PROJECT_VERSION: "81"
targets:
  MaiChat:
    type: application
    platform: iOS
    sources:
      - path: MaiChat
    dependencies:
      - target: MaiChatCore
    preBuildScripts:
      - name: Build MaiAgent
        script: bash "$PROJECT_DIR/scripts/build-mobile-agent.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kongshang.maichat
        INFOPLIST_FILE: MaiChat/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: MaiChat/MaiChat-Bridging-Header.h
        OTHER_LDFLAGS: $(inherited) $(DERIVED_FILE_DIR)/libMaiMobileAgent.a -lc++ -framework Security -framework CoreFoundation -framework SystemConfiguration
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  MaiChatCore:
    type: framework
    platform: iOS
    sources:
      - path: MaiChatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kongshang.maichat.core
        GENERATE_INFOPLIST_FILE: YES
  MaiChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MaiChatUITests
    dependencies:
      - target: MaiChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MaiChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaiChatTests
      - path: MaiChat/LocalChatHistoryStore.swift
      - path: MaiChat/MarkdownInlineStyling.swift
      - path: MaiChat/MessageBubbleLayout.swift
      - path: MaiChat/ComposerDraftState.swift
      - path: MaiChat/RemoteDiagnosticsCoordinator.swift
      - path: MaiChat/RemoteDiagnosticsView.swift
      - path: ../../../tests/fixtures/remote-diagnostics-failure-receipts.json
        buildPhase: resources
      - path: ../../../tests/fixtures/remote-diagnostics-report.json
        buildPhase: resources
    dependencies:
      - target: MaiChatCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MaiChat:
    build:
      targets:
        MaiChat: all
        MaiChatCore: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - MaiChatUITests
  MaiChatCoreTests:
    build:
      targets:
        MaiChatCore: all
        MaiChatTests: [test]
    test:
      targets:
        - MaiChatTests
